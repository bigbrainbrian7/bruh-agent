[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "bruh-agent"
version = "0.2.0"
description = "Local iMessage plan coordination assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ollama",
    "pydantic",
    "google-genai",
]

[project.optional-dependencies]
release = [
    "pyinstaller>=6.0,<7.0",
]

[project.scripts]
bruh = "bruhagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
